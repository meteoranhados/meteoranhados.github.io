<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climatologia - Ranhados</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f6f8;color:#20242a}
main{max-width:1100px;margin:auto;padding:24px} h1{margin-bottom:4px}.sub{color:#626a73;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:1px solid #dde1e6;border-radius:12px;padding:16px}
.big{font-size:28px;font-weight:700}.muted{color:#6b7280;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff} th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}
th:first-child,td:first-child{text-align:left} section{margin-top:24px}
</style></head><body><main>
<h1>Climatologia - Ranhados</h1>
<p class="sub">Página provisória de validação do Climate Analyzer.</p>
<div id="cards" class="grid"></div>
<section><h2>Ano atual</h2><div id="year"></div></section>
<section><h2>Ondas de calor</h2><div id="heat"></div></section>
<section><h2>Ondas de frio</h2><div id="cold"></div></section>
<section><h2>Qualidade dos dados</h2><div id="quality"></div></section>
<script>
Promise.all([fetch("climate_summary.json").then(r=>r.json()),fetch("climate_waves.json").then(r=>r.json())]).then(([s,w])=>{
 const hs=s.heatwave,cs=s.coldwave;
 cards.innerHTML=`<div class="card"><div class="muted">Último dia fechado</div><div class="big">${s.source_last_closed_day}</div></div>
 <div class="card"><div class="muted">Onda de calor</div><div class="big">${hs.active?"ATIVA":"Não ativa"}</div><div>${hs.qualifying_streak_days} dia(s) qualificativos</div></div>
 <div class="card"><div class="muted">Onda de frio</div><div class="big">${cs.active?"ATIVA":"Não ativa"}</div><div>${cs.qualifying_streak_days} dia(s) qualificativos</div></div>
 <div class="card"><div class="muted">Falhas no histórico</div><div class="big">${s.quality.missing_day_count}</div><div>dias em falta</div></div>`;
 const y=s.current_year;
 if(y){const o=y.observed,n=y.normal_1991_2020;year.innerHTML=`<table>
 <tr><th>Indicador</th><th>${y.year}</th><th>Normal 1991-2020</th></tr>
 <tr><td>Tmax média</td><td>${o.tmax_mean_c} °C</td><td>${n.tmax_mean_c} °C</td></tr>
 <tr><td>T média</td><td>${o.tmean_c} °C</td><td>${n.tmean_c} °C</td></tr>
 <tr><td>Tmin média</td><td>${o.tmin_mean_c} °C</td><td>${n.tmin_mean_c} °C</td></tr>
 <tr><td>Precipitação</td><td>${o.precip_mm} mm</td><td>${n.precip_mm} mm</td></tr>
 <tr><td>Dias em onda de calor</td><td>${o.heatwave_days}</td><td>${n.heatwave_days}</td></tr>
 <tr><td>Dias em onda de frio</td><td>${o.coldwave_days}</td><td>${n.coldwave_days}</td></tr></table>`;}
 const makeWaves=(eps)=>eps.length?`<table><tr><th>Início</th><th>Fim</th><th>Dias</th><th>Anomalia média</th></tr>`+
 eps.slice().reverse().slice(0,12).map(e=>`<tr><td>${e.start}</td><td>${e.end}</td><td>${e.days}</td><td>${e.mean_departure_c} °C</td></tr>`).join("")+`</table>`:"Sem episódios confirmados.";
 heat.innerHTML=makeWaves(w.heatwaves); cold.innerHTML=makeWaves(w.coldwaves);
 quality.innerHTML=`${s.quality.missing_day_count} dias em falta, ${s.quality.invalid_row_count} linhas inválidas e ${s.quality.duplicate_count} duplicados.`;
}).catch(err=>document.body.insertAdjacentHTML("beforeend","<pre>"+err+"</pre>"));
</script></main></body></html>
